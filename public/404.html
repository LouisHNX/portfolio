<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Louis Garrido</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { --paper: #f8f6f1; --ink: #18211c; --soft: #5f5d55; --accent: #1d5a41; }
      @media (prefers-color-scheme: dark) {
        :root { --paper: #151513; --ink: #eae7de; --soft: #a6a398; --accent: #86cfa6; color-scheme: dark; }
      }
      body { margin: 0; padding: 18vh 24px; background: var(--paper); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      main { max-width: 36rem; margin: 0 auto; }
      h1 { font: 400 2.6rem/1.1 Georgia, 'Times New Roman', serif; margin: 0 0 1rem; }
      p { margin: 0 0 0.5rem; color: var(--soft); }
      a { color: var(--accent); text-underline-offset: 3px; }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      .links { margin-top: 1.5rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>This page doesn't exist or has moved.</p>
      <p lang="fr">Cette page n'existe pas ou a été déplacée.</p>
      <p class="links"><a href="/en/">Home page</a> · <a href="/fr/" lang="fr">Page d'accueil</a></p>
    </main>
  </body>
</html>
